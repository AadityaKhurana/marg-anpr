name: sih-anpr-prod

# Production stack for MARG. Run it ON ITS OWN (not layered over docker-compose.yml):
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from the dev docker-compose.yml:
#   - Frontend is a real production build (Vite -> nginx), not the Vite dev server.
#   - nginx serves the app and reverse-proxies /api + /ws to the api container,
#     so ONLY port 80 is published. The app stays on one origin.
#   - API runs without --reload and without the source bind-mount (baked image).
#   - Postgres / Redis / MinIO publish NO host ports — they are reachable only
#     inside the compose network (closes the default-credential exposure).
#   - Every service has log rotation (max 3 x 10MB) so disk can't fill from logs.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-anpr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-anpr}
      POSTGRES_DB: ${POSTGRES_DB:-anpr}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Schema auto-applies only on first init (empty volume).
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-anpr} -d ${POSTGRES_DB:-anpr}"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging: *default-logging
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging: *default-logging
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    logging: *default-logging
    restart: unless-stopped

  # One-shot: wait for MinIO, create the media bucket, then exit.
  minio-init:
    # The server image bundles the `mc` client, so reuse it here — avoids a
    # separate mc image/tag (quay publishes no mc:latest).
    image: quay.io/minio/minio:RELEASE.2025-09-06T17-38-46Z
    depends_on:
      minio:
        condition: service_started
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-anpr-media}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$S3_ACCESS_KEY\" \"$$S3_SECRET_KEY\"; do
        echo 'waiting for minio...'; sleep 2;
      done;
      mc mb --ignore-existing local/$$S3_BUCKET;
      mc anonymous set none local/$$S3_BUCKET;
      echo 'minio bucket ready';
      "
    logging: *default-logging

  api:
    build: ./backend
    env_file: .env
    # Production: no --reload, no source bind-mount, no published port.
    # The frontend's nginx proxies to api:8000 over the internal network.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  # ---- pipeline workers (share one image built from workers/Dockerfile) ----
  persistence:
    image: sih-anpr-worker
    build: { context: ., dockerfile: workers/Dockerfile }
    env_file: .env
    working_dir: /app/workers/persistence
    command: ["python", "worker.py"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    logging: *default-logging
    restart: unless-stopped

  alerts:
    image: sih-anpr-worker
    build: { context: ., dockerfile: workers/Dockerfile }
    env_file: .env
    working_dir: /app
    command: ["python", "-m", "workers.alerts.worker"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    logging: *default-logging
    restart: unless-stopped

  analytics:
    image: sih-anpr-worker
    build: { context: ., dockerfile: workers/Dockerfile }
    env_file: .env
    working_dir: /app
    command: ["python", "-m", "workers.analytics.worker"]
    depends_on:
      postgres: { condition: service_healthy }
    logging: *default-logging
    restart: unless-stopped

  # Synthetic OCR stand-in — drives the pipeline for the demo.
  producer:
    image: sih-anpr-worker
    build: { context: ., dockerfile: workers/Dockerfile }
    env_file: .env
    working_dir: /app/workers/producer
    command: ["python", "feed.py"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    logging: *default-logging
    restart: unless-stopped

  # Production build: Vite bundle served by nginx (see frontend/Dockerfile).
  # nginx proxies /api and /ws to the api container, so only port 80 is public.
  frontend:
    build:
      context: ./frontend
      args:
        VITE_USE_MOCK: "false"
        VITE_API_BASE_URL: /api
        VITE_WS_URL: /ws/live
        VITE_MAP_CENTER_LAT: "28.5900"
        VITE_MAP_CENTER_LNG: "77.0470"
        VITE_MAP_ZOOM: "13"
    ports:
      - "80:80"
    depends_on:
      - api
    logging: *default-logging
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
